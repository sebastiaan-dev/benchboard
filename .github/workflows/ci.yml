name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, tests, build, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck, unit and integration tests, web build
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Install Chromium for the browser tests
        run: bun x playwright-core install --with-deps chromium
      - name: Browser tests
        run: bun test --timeout 120000 e2e

  binaries:
    name: Standalone binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compile (linux and macOS, x64 and arm64)
        run: bun scripts/build-binaries.ts --all
      - name: The Linux binary runs on its own
        run: |
          ./dist/bin/benchboard-linux-x64 --version
          ./dist/bin/benchboard-linux-x64 schema | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/bin/
          if-no-files-found: error

  linux-profiling:
    name: Linux profiling (runner setup, hyperfine, samply)
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin
      - name: Prepare the runner like a benchmark host, with the released binary
        run: sudo BENCHBOARD_BINARY="$PWD/dist/bin/benchboard-linux-x64" sh deploy/linux-runner-setup.sh
      - name: Benchmark, profile and compare
        run: sh scripts/linux-profiling-smoke.sh

  release:
    name: Publish binaries
    needs: [check, linux-profiling]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/bin/* --generate-notes --verify-tag
      - name: Rolling "edge" prerelease from main
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f edge "$GITHUB_SHA" && git push -f origin refs/tags/edge
          notes="Latest build of main ($GITHUB_SHA). Install on Linux: deploy/linux-runner-setup.sh"
          if gh release view edge >/dev/null 2>&1; then
            gh release upload edge dist/bin/* --clobber
            gh release edit edge --prerelease --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create edge dist/bin/* --prerelease --title "edge" --notes "$notes" --target "$GITHUB_SHA"
          fi

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "value=$(jq -r .version packages/cli/package.json)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      # No QEMU: the Dockerfile cross-compiles on the runner's platform for each target.
      - uses: docker/setup-buildx-action@v3
      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: benchboard:ci
          build-args: BENCHBOARD_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image (read-only, unprivileged)
        run: |
          docker run -d --name benchboard --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:4319:4319 -e BENCHBOARD_PUBLIC_URL=http://localhost:4319 benchboard:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:4319/healthz && break
            sleep 1
          done
          test "$(docker run --rm benchboard:ci --version)" = "benchboard ${{ steps.version.outputs.value }}"
          token=$(docker exec benchboard benchboard token create ci --scope read 2>/dev/null)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"query":"{ runs { id } }"}' http://localhost:4319/graphql)" = 401
          curl -fsS -X POST -H 'content-type: application/json' -H "authorization: Bearer $token" -d '{"query":"{ runs { id } }"}' http://localhost:4319/graphql
          curl -fsS http://localhost:4319/ | grep -q '<title>Benchboard'
          docker stop benchboard
          docker logs benchboard
          docker images benchboard:ci
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BENCHBOARD_VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the published image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
