name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, tests, build, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck, unit and integration tests, web build
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Install Chromium for the browser tests
        run: bun x playwright-core install --with-deps chromium
      - name: Browser tests
        run: bun test --timeout 120000 e2e

  linux-profiling:
    name: Linux profiling (runner setup, hyperfine, samply)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --production --filter @benchboard/cli
      - name: Prepare the runner like a benchmark host
        run: sudo BENCHBOARD_SOURCE="$PWD" sh deploy/linux-runner-setup.sh
      - name: Benchmark, profile and compare
        run: sh scripts/linux-profiling-smoke.sh

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: benchboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name benchboard -p 127.0.0.1:4319:4319 -e BENCHBOARD_PUBLIC_URL=http://localhost:4319 benchboard:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:4319/healthz && break
            sleep 1
          done
          token=$(docker exec benchboard benchboard token create ci --scope read 2>/dev/null)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"query":"{ runs { id } }"}' http://localhost:4319/graphql)" = 401
          curl -fsS -X POST -H 'content-type: application/json' -H "authorization: Bearer $token" -d '{"query":"{ runs { id } }"}' http://localhost:4319/graphql
          docker stop benchboard
          docker logs benchboard
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
