"""
Benchboard: Hyperfine measurements attributed to commits, pull requests and machines.
Times are in seconds. Ratios compare candidate / reference; above 1 is slower.
"""
type Query {
  repositories: [Repository!]!
  repository(slug: String, id: ID): Repository
  pullRequest(id: ID!): PullRequest
  run(id: ID!): Run
  measurement(id: ID!): Measurement
  "Measurements by ID, in request order; unknown IDs are omitted."
  measurements(ids: [ID!]!): [Measurement!]!
  benchmark(id: ID!): Benchmark
  machine(id: ID!): Machine
  profile(id: ID!): Profile
  "Per-function CPU-time change between two profiles (e.g. reference and head of a series)."
  profileDiff(base: ID!, head: ID!, limit: Int = 200, metric: ProfileMetric = CPU): ProfileDiff!
  "Runs across all repositories, newest first."
  runs(limit: Int = 50, offset: Int = 0): [Run!]!
}

type Mutation {
  "Fetches the latest commits of a tracked pull request or branch (via gh or git)."
  syncPullRequest(id: ID!): PullRequest!
  "Starts tracking a GitHub pull request: `123`, `owner/name#123` or a URL."
  trackGithubPullRequest(repository: ID!, reference: String!): PullRequest!
  deleteRun(id: ID!): Boolean!
  deleteProfile(id: ID!): Boolean!
}

type Repository {
  id: ID!
  slug: String!
  name: String!
  remoteUrl: String
  githubRepo: String
  localPath: String
  pullRequests: [PullRequest!]!
  benchmarks: [Benchmark!]!
  runs(limit: Int = 50, offset: Int = 0): [Run!]!
  runCount: Int!
  commit(sha: String!): Commit
  "Profiles attached to this repository's measurements, newest first."
  profiles(limit: Int = 100): [Profile!]!
}

type Commit {
  sha: String!
  shortSha: String!
  subject: String
  author: String
  authoredAt: String
  committedAt: String
  parents: [String!]!
  url: String
  measurements: [Measurement!]!
  pullRequests: [PullRequest!]!
}

enum PullRequestSource {
  GITHUB
  LOCAL
}

type PullRequest {
  id: ID!
  repository: Repository!
  source: PullRequestSource!
  githubRepo: String
  number: Int
  title: String!
  url: String
  state: String!
  author: String
  headRef: String!
  headSha: String!
  baseRef: String!
  baseSha: String
  updatedAt: String
  syncedAt: String!
  baseCommit: Commit
  "PR commits, oldest first, excluding the base."
  commits: [Commit!]!
  report(statistic: Statistic = MEDIAN, includeDirty: Boolean = false, machine: ID, threshold: Float = 0.02): PullRequestReport!
}

enum Statistic {
  MEDIAN
  MEAN
}

enum Verdict {
  REGRESSION
  IMPROVEMENT
  UNCHANGED
  INCONCLUSIVE
  FAILED
  "Fewer than 3 samples on a side: the ratio is descriptive only, with no interval or verdict."
  INSUFFICIENT
}

enum Pairing {
  "The baseline was measured in the same Hyperfine invocation as the candidate (shared session; not interleaved)."
  SAME_INVOCATION
  "No shared invocation: each side is its commit's representative measurement."
  REPRESENTATIVES
}

type PullRequestReport {
  statistic: Statistic!
  threshold: Float!
  includeDirty: Boolean!
  "Machine whose measurements are compared; comparisons never mix machines."
  machine: Machine
  machines: [MachineCount!]!
  "Base (position 0) followed by PR commits."
  commits: [ReportCommit!]!
  series: [SeriesReport!]!
  summary: ReportSummary!
}

type MachineCount {
  machine: Machine!
  count: Int!
}

type ReportCommit {
  position: Int!
  isBase: Boolean!
  commit: Commit!
}

type ReportSummary {
  series: Int!
  regressions: Int!
  improvements: Int!
  unchanged: Int!
  inconclusive: Int!
  failed: Int!
  insufficient: Int!
  "Series whose first measurement is not at the PR base."
  missingReference: Int!
  "Series not measured at the PR head commit (excluded from head verdicts)."
  missingHead: Int!
  "Head comparisons whose sides come from different Hyperfine runs."
  crossRun: Int!
}

type SeriesReport {
  id: ID!
  benchmark: Benchmark!
  caseKey: String!
  label: String!
  points: [ReportPoint!]!
  reference: ReportPoint
  referenceIsBase: Boolean!
  "The PR head commit's point, when this series was measured there."
  head: ReportPoint
  "Head vs reference; null when the head was not measured."
  headComparison: Comparison
  "Last measured commit, which may precede the head."
  latest: ReportPoint
  latestComparison: Comparison
  "Verdict of headComparison."
  verdict: Verdict
}

type ReportPoint {
  position: Int!
  isBase: Boolean!
  commit: Commit!
  "Representative measurement: passing, clean and most recent first."
  measurement: Measurement
  "All matching measurements at this commit, representative first."
  candidates: [Measurement!]!
  vsReference: Comparison
  vsPrevious: Comparison
  "Position of the previous measured commit (the baseline side of vsPrevious)."
  previousPosition: Int
  "vsPrevious spans unmeasured commits, so the step is not attributable to this commit alone."
  spansGap: Boolean!
}

"Every figure for a comparison (durations, distributions, provenance, profiles) comes from candidate and baseline."
type Comparison {
  candidate: Measurement!
  baseline: Measurement!
  statistic: Statistic!
  ratio: Float!
  "Relative change in percent: (ratio - 1) * 100."
  changePercent: Float!
  "Percentile-bootstrap 95% interval of the ratio; null with fewer than 3 samples on a side."
  low: Float
  high: Float
  resamples: Int!
  verdict: Verdict!
  "Both sides come from one Hyperfine invocation."
  sameRun: Boolean!
  pairing: Pairing!
  "Other eligible measurements at the two commits that were not used."
  alternatives: Int!
}

type Benchmark {
  id: ID!
  key: String!
  title: String
  description: String
  repository: Repository!
  cases: [BenchmarkCase!]!
  runs(limit: Int = 50, offset: Int = 0): [Run!]!
}

type BenchmarkCase {
  caseKey: String!
  count: Int!
  lastRecordedAt: String!
  "Chronological measurements of this series."
  measurements(limit: Int = 500): [Measurement!]!
}

type Machine {
  id: ID!
  hostname: String!
  os: String!
  arch: String!
  cpu: String!
  ram: Float!
}

type Run {
  id: ID!
  repository: Repository!
  machine: Machine!
  recordedAt: String!
  title: String
  conditions: String
  environment: String
  invocation: String
  warmup: Int
  notes: String
  "One-based in-run comparison baseline."
  baselinePosition: Int
  exportSha256: String!
  exportPath: String!
  sourcePath: String
  checkoutPath: String
  checkoutHead: String
  checkoutBranch: String
  checkoutDirty: Boolean
  legacyId: String
  measurements: [Measurement!]!
  "Each repeated series (same benchmark and case) compared with its first measurement in this run."
  pairedComparisons(statistic: Statistic = MEDIAN, threshold: Float = 0.02): [Comparison!]!
}

enum MeasurementStatus {
  PASSED
  FAILED
  UNVERIFIED
}

type Measurement {
  id: ID!
  run: Run!
  position: Int!
  benchmark: Benchmark!
  caseKey: String!
  label: String!
  command: String
  exportedCommand: String!
  commitSha: String
  commit: Commit
  dirty: Boolean
  "Commit was defaulted to the checkout HEAD or inferred from notes, not recorded explicitly."
  commitInferred: Boolean!
  revision: String
  build: String
  notes: String
  parameters: [Parameter!]
  status: MeasurementStatus!
  n: Int!
  mean: Float!
  stddev: Float
  median: Float!
  min: Float!
  max: Float!
  q1: Float!
  q3: Float!
  p95: Float!
  cv: Float
  userTime: Float
  systemTime: Float
  rssMedian: Float
  rssPeak: Float
  recordedAt: String!
  times: [Float!]!
  exitCodes: [Int!]
  "Sampled profiles (samply) recorded for this case's workload."
  profiles: [Profile!]!
  "Bootstrap comparison of this measurement against another (e.g. the run's baseline case)."
  compare(baseline: ID!, statistic: Statistic = MEDIAN, threshold: Float = 0.02): Comparison
}

type Parameter {
  name: String!
  value: String!
}

"A sampled CPU profile (samply / Firefox Profiler processed format) attached to a measurement."
type Profile {
  id: ID!
  measurement: Measurement!
  label: String
  tool: String!
  product: String
  "Workload repetitions in the profile; per-iteration times divide by this."
  iterations: Int!
  samples: Int!
  intervalMs: Float!
  durationMs: Float
  "On-CPU time per iteration, summed over threads (from samply's per-sample CPU deltas; see cpuSource)."
  cpuMs: Float!
  "Sampled time per iteration (samples × interval), summed over threads; includes waiting, sleeping and blocking."
  sampledMs: Float!
  cpuSource: CpuSource!
  threads: [ProfileThread!]!
  "Share of sampled frames that resolved to symbols (needs samply --unstable-presymbolicate)."
  symbolicatedShare: Float!
  nodeCount: Int!
  command: String
  recordedAt: String!
  sha256: String!
  hasSymbols: Boolean!
  "Raw profile download (gzip JSON)."
  rawPath: String!
  "Opens the raw profile in the Firefox Profiler, symbolicated by this server."
  firefoxProfilerUrl(origin: String!): String!
  "Aggregated call tree (see @benchboard/core CallTree)."
  tree: JSON!
  topFunctions(limit: Int = 50, by: ProfileSort = SELF, metric: ProfileMetric = CPU): [ProfileFunction!]!
  "Other profiles of the same benchmark case (other commits or runs), newest first."
  related: [Profile!]!
}

enum ProfileSort {
  SELF
  TOTAL
}

"CPU: time on CPU. SAMPLED: sampled time including off-CPU waiting (where wall time goes)."
enum ProfileMetric {
  CPU
  SAMPLED
}

enum CpuSource {
  "Measured from per-sample thread CPU deltas."
  THREAD_CPU_DELTA
  "Estimated from sample counts because the profile has no CPU deltas; includes off-CPU time."
  SAMPLE_COUNT
}

type ProfileThread {
  name: String!
  samples: Int!
  "Per iteration."
  cpuMs: Float!
  "Per iteration."
  sampledMs: Float!
}

type ProfileFunction {
  name: String!
  library: String
  selfMs: Float!
  totalMs: Float!
  selfShare: Float!
  totalShare: Float!
}

type ProfileDiff {
  base: Profile!
  head: Profile!
  metric: ProfileMetric!
  "Per iteration, in the chosen metric."
  baseMs: Float!
  headMs: Float!
  functions: [ProfileFunctionDelta!]!
}

type ProfileFunctionDelta {
  name: String!
  library: String
  baseSelfMs: Float!
  headSelfMs: Float!
  deltaSelfMs: Float!
  baseTotalMs: Float!
  headTotalMs: Float!
  deltaTotalMs: Float!
  baseSelfShare: Float!
  headSelfShare: Float!
}

"Arbitrary JSON (used for compact call trees)."
scalar JSON
